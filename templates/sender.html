<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% if lang == 'en' %}🎙️ Nanny – Sender{% else %}🎙️ Niania – Nadajnik{% endif %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
    #status {
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      color: #aaa;
    }
    #btn {
      width: 140px; height: 140px;
      border-radius: 50%;
      border: none;
      font-size: 3rem;
      cursor: pointer;
      background: #e94560;
      color: white;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 0 0 0 rgba(233,69,96,0.4);
    }
    #btn.active {
      background: #c0392b;
      animation: pulse 1.2s infinite;
    }
    #btn:disabled { opacity: 0.4; cursor: default; animation: none; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0    rgba(233,69,96,0.6); }
      70%  { box-shadow: 0 0 0 20px rgba(233,69,96,0); }
      100% { box-shadow: 0 0 0 0    rgba(233,69,96,0); }
    }
    #label { margin-top: 1rem; font-size: 1rem; color: #ddd; }
  </style>
</head>
<body>
  <h1>{% if lang == 'en' %}🎙️ Electronic Nanny{% else %}🎙️ Elektroniczna Niania{% endif %}</h1>
  <div id="status">{% if lang == 'en' %}Connecting to server…{% else %}Łączenie z serwerem…{% endif %}</div>
  <button id="btn" disabled>🎙️</button>
  <div id="label">{% if lang == 'en' %}Press to broadcast{% else %}Naciśnij, aby nadawać{% endif %}</div>

  <script>
    const lang = '{{ lang }}';
    const texts = {
      pl: {
        connected: '✅ Połączono z serwerem sygnalizacji',
        disconnected: '❌ Rozłączono z serwerem sygnalizacji',
        error: '⚠️ Błąd sygnalizacji',
        answerReceived: '✅ Odebrano odpowiedź',
        status: '🔴 Tworzę połączenie...',
        offerError: '❌ Błąd tworzenia oferty',
        notReady: '⚠️ Połączenie sygnalizacyjne nie jest gotowe',
        noMic: '❌ Brak dostępu do mikrofonu: ',
        connectedToListener: '✅ Połączono z odbiornikiem',
        connectionLost: '⚠️ Połączenie WebRTC utracone',
        broadcasting: 'Nadaję… (naciśnij, aby zatrzymać)',
        stopped: '⏹️ Zatrzymano',
        pressToBroadcast: 'Naciśnij, aby nadawać'
      },
      en: {
        connected: '✅ Connected to signaling server',
        disconnected: '❌ Disconnected from signaling server',
        error: '⚠️ Signaling error',
        answerReceived: '✅ Answer received',
        status: '🔴 Creating connection...',
        offerError: '❌ Offer creation failed',
        notReady: '⚠️ Signaling connection not ready',
        noMic: '❌ No microphone access: ',
        connectedToListener: '✅ Connected to listener',
        connectionLost: '⚠️ WebRTC connection lost',
        broadcasting: 'Broadcasting… (press to stop)',
        stopped: '⏹️ Stopped',
        pressToBroadcast: 'Press to broadcast'
      }
    };
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    const label = document.getElementById('label');

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const host = window.location.host;

    // session id to allow reconnection from same client
    const sessionId = Math.random().toString(36).slice(2);
    let signal = null;
    let pingInterval = null;
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 10;

    let pc = null;
    let stream = null;
    let recording = false;
    let wakeLock = null;

    function startPing() {
      stopPing();
      pingInterval = setInterval(() => {
        if (signal && signal.readyState === WebSocket.OPEN) {
          signal.send(JSON.stringify({ type: 'ping' }));
        }
      }, 15000);
    }

    function stopPing() {
      if (pingInterval) {
        clearInterval(pingInterval);
        pingInterval = null;
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => {
            console.log('Wake lock released');
            wakeLock = null;
          });
        }
      } catch (err) {
        console.warn('Wake lock not available:', err);
      }
    }

    async function releaseWakeLock() {
      try {
        if (wakeLock) {
          await wakeLock.release();
          wakeLock = null;
        }
      } catch (err) {
        console.warn('Failed to release wake lock:', err);
      }
    }

    function createSignal() {
      const url = `${proto}://${host}/signal?role=sender&sid=${sessionId}`;
      const s = new WebSocket(url);
      signal = s;

      s.onopen = () => {
        reconnectAttempts = 0;
        logStatus(texts[lang].connected);
        btn.disabled = false;
        startPing();
      };

      s.onclose = (event) => {
        console.error('Signaling closed', event);
        logStatus(texts[lang].disconnected);
        btn.disabled = true;
        stopPing();
        stopRecording();
        if (reconnectAttempts < maxReconnectAttempts) {
          const delay = Math.min(30000, 1000 * Math.pow(2, reconnectAttempts));
          reconnectAttempts += 1;
          setTimeout(createSignal, delay);
        }
      };

      s.onerror = (event) => {
        console.error('Signaling error', event);
        logStatus(texts[lang].error);
      };

      s.onmessage = async (event) => {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch (error) {
          console.warn('Invalid signaling message', event.data);
          return;
        }

        if (message.type === 'pong') {
          // heartbeat reply
          return;
        }

        if (message.type === 'answer') {
          logStatus(texts[lang].answerReceived);
          if (pc) {
            await pc.setRemoteDescription(message.sdp);
          }
        } else if (message.type === 'ice-candidate') {
          if (pc && message.candidate) {
            await pc.addIceCandidate(message.candidate);
          }
        } else if (message.type === 'status') {
          logStatus(message.message);
        } else {
          console.log('Unknown signaling message', message);
        }
      };
    }

    // start initial connection
    createSignal();

    function logStatus(text) {
      console.log(text);
      status.textContent = text;
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && recording) {
        requestWakeLock();
      }
    });

    btn.addEventListener('click', async () => {
      if (!recording) {
        await startRecording();
      } else {
        stopRecording();
      }
    });

    async function startRecording() {
      if (!signal || signal.readyState !== WebSocket.OPEN) {
        logStatus(texts[lang].notReady);
        return;
      }

      const audioConstraints = {
        audio: {
          echoCancellation: false,
          noiseSuppression: true,
          autoGainControl: false,
          sampleRate: 16000,
          channelCount: 1,
        },
      };

      try {
        stream = await navigator.mediaDevices.getUserMedia(audioConstraints);
      } catch (err) {
        logStatus(texts[lang].noMic + err.message);
        return;
      }

      // Try to keep screen awake while broadcasting
      requestWakeLock();

      pc = createPeerConnection();
      stream.getTracks().forEach((track) => {
        const sender = pc.addTrack(track, stream);
        if (sender.getParameters) {
          const params = sender.getParameters();
          params.encodings = params.encodings || [{}];
          params.encodings[0].maxBitrate = 32000;
          sender.setParameters(params).catch((error) => {
            console.warn('Nie udało się ustawić parametrów audio:', error);
          });
        }
      });

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        signal.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription }));
        logStatus(texts[lang].status);
      } catch (err) {
        console.error('Offer creation failed', err);
        logStatus(texts[lang].offerError);
      }

      recording = true;
      btn.classList.add('active');
      btn.textContent = '⏹️';
      label.textContent = texts[lang].broadcasting;
    }

    function createPeerConnection() {
      const peer = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
      });

      peer.onicecandidate = (event) => {
        if (event.candidate && signal && signal.readyState === WebSocket.OPEN) {
          signal.send(JSON.stringify({ type: 'ice-candidate', candidate: event.candidate }));
        }
      };

      peer.onconnectionstatechange = () => {
        console.log('PC state:', peer.connectionState);
        if (peer.connectionState === 'connected') {
          logStatus(texts[lang].connectedToListener);
        } else if (peer.connectionState === 'failed' || peer.connectionState === 'disconnected') {
          logStatus(texts[lang].connectionLost);
          stopRecording();
        }
      };

      return peer;
    }

    function stopRecording() {
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
      }
      if (pc) {
        pc.close();
        pc = null;
      }
      recording = false;
      btn.classList.remove('active');
      btn.textContent = '🎙️';
      label.textContent = texts[lang].pressToBroadcast;
      releaseWakeLock();
      logStatus(texts[lang].stopped);
    }
  </script>
</body>
</html>
